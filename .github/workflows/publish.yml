# sources:
#   - https://andrewlock.net/easily-publishing-nuget-packages-from-github-actions-with-trusted-publishing/
#   - https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing

name: build-and-pack
on:
  push:
    tags: ['v*']

jobs:
  build-and-publish:
    permissions:
      contents: read
      id-token: write  # enable GitHub OIDC token issuance for this job

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: dotnet build
        run: |
          dotnet build -c Release

      - name: dotnet pack
        run: |
          dotnet pack --no-build

      # Use the ambient GitHub token to login to NuGet and retrieve an API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: blokyk

      # Push the package
      - name: NuGet push
        run: dotnet nuget push bin/Release/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
